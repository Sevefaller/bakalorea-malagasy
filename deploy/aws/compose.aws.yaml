# Configuration AWS temporaire sans domaine - HTTP uniquement

x-production-env: &production-env
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: http://${DOMAIN}
  SESSION_SECURE_COOKIE: 'false'

services:
  backend:
    environment: *production-env

  migrate:
    environment: *production-env

  reverb:
    environment: *production-env

  scheduler:
    environment: *production-env

  caddy:
    environment:
      SITE_ADDRESS: :80
name: Deploy Bakalorea to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python3 - "$PAYLOAD" <<'PY'
          import sys
          import json
          import base64

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          data = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC subject:")
          print(data.get("sub"))

          print("OIDC audience:")
          print(data.get("aud"))

          print("Repository:")
          print(data.get("repository"))

          print("Ref:")
          print(data.get("ref"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::056164770031:role/BakaloreaGitHubDeployRole
          aws-region: eu-north-1

      - name: Create deployment archive
        shell: bash
        run: |
          zip -r bakalorea-aws.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "frontend/node_modules/*" \
            -x "backend/vendor/*" \
            -x ".env" \
            -x ".env.aws"

      - name: Upload archive to S3
        shell: bash
        run: |
          aws s3 cp bakalorea-aws.zip \
            s3://bakalorea-prod-storage-5lowozadiq3h/releases/bakalorea-aws.zip

      - name: Deploy on EC2 with SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-01212aa95e08908e8" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "sudo -i bash -c \"aws s3 cp s3://bakalorea-prod-storage-5lowozadiq3h/releases/bakalorea-aws.zip /tmp/bakalorea-aws.zip\"",
              "sudo -i bash -c \"rm -rf /tmp/bakalorea-release && mkdir -p /tmp/bakalorea-release\"",
              "sudo -i bash -c \"unzip -o /tmp/bakalorea-aws.zip -d /tmp/bakalorea-release\"",
              "sudo -i bash -c \"cp -a /tmp/bakalorea-release/. /opt/bakalorea/\"",
              "sudo -i bash -c \"cd /opt/bakalorea && bash deploy/aws/deploy.sh 13.51.54.229\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01212aa95e08908e8"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01212aa95e08908e8" \
            --query '{
              Status:Status,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }'
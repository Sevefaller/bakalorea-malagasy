name: Deploy Bakalorea to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::056164770031:role/BakaloreaGitHubDeployRole
          aws-region: eu-north-1

      - name: Create deployment archive
        run: |
          zip -r bakalorea-aws.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "frontend/node_modules/*" \
            -x "backend/vendor/*" \
            -x ".env" \
            -x ".env.aws"

      - name: Upload archive to S3
        run: |
          aws s3 cp bakalorea-aws.zip \
            s3://bakalorea-prod-storage-5lowozadiq3h/releases/bakalorea-aws.zip

      - name: Deploy on EC2 with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-01212aa95e08908e8" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "sudo -i bash -c \"aws s3 cp s3://bakalorea-prod-storage-5lowozadiq3h/releases/bakalorea-aws.zip /tmp/bakalorea-aws.zip\"",
              "sudo -i bash -c \"unzip -o /tmp/bakalorea-aws.zip -d /opt/bakalorea\"",
              "sudo -i bash -c \"cd /opt/bakalorea && bash deploy/aws/deploy.sh 13.51.54.229\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01212aa95e08908e8"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01212aa95e08908e8"